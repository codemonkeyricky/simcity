<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="main.css">
    <title>SimCity Scene</title>

</head>

<body>
    <div id="root-window">
        <div id="render-target"></div>
    </div>

    <script type="module">
        import { createScene } from './src/scene.ts';
        import {createCity } from './src/city.ts';

        window.onload = () => {
            const scene = createScene();
            const city = createCity(8);

            scene.initialize(city);
            window.scene = scene;
            document.addEventListener('mousedown', window.scene.onMouseDown, false);
            document.addEventListener('mouseup', window.scene.onMouseUp, false);
            document.addEventListener('mousemove', window.scene.onMouseMove, false);
            window.scene.start();
        }
    </script>


</body>

</html>
